<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>team-room · kanban</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --card:#1c2128; --border:#30363d;
    --fg:#e6edf3; --dim:#8b949e; --faint:#6e7681;
    --ready:#3fb950; --running:#58a6ff; --blocked:#f85149; --done:#8b949e;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:2}
  header h1{font-size:14px;font-weight:600;margin:0;letter-spacing:.2px}
  header h1 .board{color:var(--dim);font-weight:400}
  .live{display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-size:12px}
  .live .dot{width:8px;height:8px;border-radius:50%;background:var(--ready);box-shadow:0 0 0 0 rgba(63,185,80,.6);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,185,80,.5)}70%{box-shadow:0 0 0 6px rgba(63,185,80,0)}100%{box-shadow:0 0 0 0 rgba(63,185,80,0)}}
  .meta{margin-left:auto;color:var(--faint);font-size:12px;font-family:var(--mono)}
  .cols{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;padding:14px 16px;align-items:start;overflow-x:auto}
  .col{background:var(--panel);border:1px solid var(--border);border-radius:8px;min-height:120px;display:flex;flex-direction:column}
  .col-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.6px}
  .col-h .n{margin-left:auto;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1px 8px;font-family:var(--mono);font-size:11px;color:var(--dim)}
  .col-h .swatch{width:9px;height:9px;border-radius:2px}
  .col[data-status=ready] .swatch{background:var(--ready)}
  .col[data-status=running] .swatch{background:var(--running)}
  .col[data-status=blocked] .swatch{background:var(--blocked)}
  .col[data-status=done] .swatch{background:var(--done)}
  .col[data-status=blocked]{border-color:rgba(248,81,73,.35)}
  .list{padding:8px;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 160px);overflow-y:auto}
  .card{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--faint);border-radius:6px;padding:9px 10px}
  .card .title{font-size:13px;font-weight:500;color:var(--fg);word-break:break-word}
  .card .sub{color:var(--faint);font-size:11px;font-family:var(--mono);margin-top:3px}
  .foot{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--dim)}
  .chip .d{width:8px;height:8px;border-radius:50%}
  .prio{font-size:10px;font-family:var(--mono);border:1px solid var(--border);border-radius:4px;padding:0 5px;color:var(--dim)}
  .run{font-size:11px;font-family:var(--mono);color:var(--dim)}
  .run.running{color:var(--running)} .run.blocked{color:var(--blocked)} .run.crashed,.run.rate_limited,.run.failed{color:var(--blocked)}
  .empty{color:var(--faint);font-size:12px;padding:6px 2px;font-style:italic}
  .err{padding:16px;color:var(--blocked);font-family:var(--mono);font-size:13px}
  @media (max-width:760px){.cols{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
  <h1>team-room <span class="board" id="board">· kanban</span></h1>
  <span class="live"><span class="dot"></span>live</span>
  <span class="meta" id="meta">loading…</span>
</header>
<div class="cols" id="cols"></div>
<script>
// Assignee identity colors — single source of truth, same hexes as config.json.
const AGENT_COLORS = {
  "product-owner":"#e8b93d","pixel-art-designer":"#e05d5d","ux-ui":"#5db8e0",
  "software-engineer":"#7ec96f","qa-visual":"#c98fe0","qa-journey":"#e09a5d"
};
const COLS = [
  {key:"ready",   label:"Ready",   match:["ready","todo","queued","open","backlog"]},
  {key:"running", label:"Running", match:["running","in_progress","active"]},
  {key:"blocked", label:"Blocked", match:["blocked"]},
  {key:"done",    label:"Done",    match:["done","completed","closed"]}
];
const colsEl = document.getElementById("cols");
const metaEl = document.getElementById("meta");
const boardEl = document.getElementById("board");

function esc(s){return (s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function colFor(status){
  const s=(status||"").toLowerCase();
  for(const c of COLS) if(c.match.includes(s)) return c.key;
  return "ready"; // unknown statuses surface in Ready, never dropped
}
function rel(ts){ // ts is SECONDS (kanban.db convention)
  if(!ts) return "";
  const d=Date.now()/1000-ts;
  if(d<60) return "just now";
  if(d<3600) return Math.floor(d/60)+"m ago";
  if(d<86400) return Math.floor(d/3600)+"h ago";
  return Math.floor(d/86400)+"d ago";
}
function card(t){
  const color=AGENT_COLORS[t.assignee]||"#6e7681";
  const run=t.run&&t.run.status;
  const runCls=run?(" "+run):"";
  const prio=t.priority>0?`<span class="prio">P${t.priority}</span>`:"";
  const when=t.status==="done"&&t.completed_at?("done "+rel(t.completed_at))
          :t.status==="blocked"?("blocked "+rel(t.started_at||t.created_at))
          :t.status==="running"&&t.started_at?("running "+rel(t.started_at))
          :rel(t.created_at);
  return `<div class="card" style="border-left-color:${color}" title="${esc(t.id)}">
    <div class="title">${esc(t.title)}</div>
    <div class="sub">${esc(when)}</div>
    <div class="foot">
      <span class="chip"><span class="d" style="background:${color}"></span>${esc(t.assignee||"unassigned")}</span>
      ${prio}
      ${run?`<span class="run ${runCls}">${esc(run)}</span>`:""}
    </div>
  </div>`;
}
function render(data){
  boardEl.textContent="· "+(data.board||"default");
  const by={ready:[],running:[],blocked:[],done:[]};
  (data.tasks||[]).forEach(t=>by[colFor(t.status)].push(t));
  colsEl.innerHTML=COLS.map(c=>{
    const items=by[c.key];
    const body=items.length?items.map(card).join(""):`<div class="empty">none</div>`;
    return `<section class="col" data-status="${c.key}">
      <div class="col-h"><span class="swatch"></span>${c.label}<span class="n">${items.length}</span></div>
      <div class="list">${body}</div>
    </section>`;
  }).join("");
  const n=(data.tasks||[]).length;
  metaEl.textContent=`${n} tasks · ${by.blocked.length} blocked · ${by.running.length} running · updated ${new Date().toLocaleTimeString()}`;
}
async function load(){
  try{
    const r=await fetch("/kanban",{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    render(await r.json());
  }catch(e){
    colsEl.innerHTML=`<div class="err">kanban load failed: ${esc(e.message)}<br>is the /kanban endpoint live?</div>`;
    metaEl.textContent="offline";
  }
}
load();
setInterval(load,5000);
</script>
</body>
</html>
